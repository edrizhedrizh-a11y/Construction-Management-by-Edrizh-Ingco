<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a37">
  <title>Photo Reference Log | GOCO TAWIRAN</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="records">
  <div class="topbar"><div class="topbar-inner"><div class="brand-block"><div class="logo-mark">GT</div><div><h1 class="brand-title">Photo Reference Log</h1><p class="brand-subtitle">All saved records in table format</p></div></div><nav class="desktop-nav" data-nav></nav><div class="sync-pill" data-sync-pill><span class="sync-dot"></span><span data-sync-label>Checking</span></div></div></div>
  <main class="app-shell">
    <section class="page-heading">
      <div>
        <p class="hero-eyebrow">Master table</p>
        <h2>Photo Reference Log</h2>
        <p>Use this table for review, filtering, audit, and export to CSV. The Google Sheet remains the Excel-exportable master database.</p>
      </div>
      <div class="page-actions no-print">
        <button class="btn secondary" data-refresh>Refresh</button>
        <button class="btn secondary" id="downloadCsvBtn">Download CSV</button>
        <button class="btn warning" onclick="window.print()">Print / Save PDF</button>
      </div>
    </section>
    <section class="filter-panel no-print" data-filter-panel></section>
    <section id="recordsTableContainer"></section>
  </main>
  <nav class="bottom-nav" data-bottom-nav></nav>
</body>
</html>
