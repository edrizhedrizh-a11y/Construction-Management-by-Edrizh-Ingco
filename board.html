<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a37">
  <title>Photo Issue Board | GOCO TAWIRAN</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="photo-board">
  <div class="topbar"><div class="topbar-inner"><div class="brand-block"><div class="logo-mark">GT</div><div><h1 class="brand-title">Photo Issue Board</h1><p class="brand-subtitle">Printable construction photo cards</p></div></div><nav class="desktop-nav" data-nav></nav><div class="sync-pill" data-sync-pill><span class="sync-dot"></span><span data-sync-label>Checking</span></div></div></div>
  <main class="app-shell">
    <section class="page-heading">
      <div>
        <p class="hero-eyebrow">Photo documentation</p>
        <h2>Photo Issue Board</h2>
        <p>Cards show photo, issue ID, area, trade, status, priority, target date, and concern/note.</p>
      </div>
      <div class="page-actions no-print">
        <button class="btn secondary" data-refresh>Refresh</button>
        <button class="btn warning" onclick="window.print()">Print / Save PDF</button>
      </div>
    </section>
    <section class="filter-panel no-print" data-filter-panel></section>
    <section class="cards-grid" id="recordsContainer"></section>
  </main>
  <nav class="bottom-nav" data-bottom-nav></nav>
</body>
</html>
